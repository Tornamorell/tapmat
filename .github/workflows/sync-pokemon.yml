name: Sync Pokémon (TCGdex)

# TCGdex has no bulk file: a full sync is ~21k requests (~20 min), so it runs weekly, and the
# daily run only refreshes the prices of printings in a collection. See D17 in docs/decisions.md.
on:
  schedule:
    - cron: "15 11 * * *" # daily: owned printings' prices
    - cron: "0 12 * * 3" # Wednesdays: full catalog
  workflow_dispatch:
    inputs:
      full:
        description: "Full catalog sync instead of owned prices only"
        type: boolean
        default: false

concurrency:
  group: pokemon-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Decide the mode in the shell, not in the expression. `cond && '' || '--owned-only'` looks
      # like a ternary but isn't: GitHub's && and || return the operand, and '' is falsy, so the
      # true branch fell through to --owned-only. The full sync never ran from CI between the
      # first commit and 2026-09-21 — every Wednesday run finished in five seconds and reported
      # success, and no Pokémon set released after 2026-09-11 ever reached the catalog.
      - name: Sync
        env:
          FULL: ${{ github.event.schedule == '0 12 * * 3' || inputs.full }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "$FULL" = "true" ]; then
            npm run sync:pokemon
          else
            npm run sync:pokemon -- --owned-only
          fi
